<!DOCTYPE html>
<html lang="en" style="overscroll-behavior: none;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Track the movies, TV shows, and books you've finished." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Resolve the theme before first paint so the app never flashes light and then
      snaps to dark. ThemeContext reads the resulting class back rather than
      recomputing it. Inter is self-hosted via @fontsource-variable/inter (see
      src/styles.css) — there is deliberately no render-blocking font <link> here.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f172a')
          }
        } catch (e) {}
      })()
    </script>

    <title>Media Tracker</title>
  </head>
  <body
    class="bg-white text-gray-900 antialiased transition-colors duration-150 dark:bg-gray-900 dark:text-gray-100"
    style="overscroll-behavior: none;"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
